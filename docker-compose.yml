services:
  bot:
    build: .
    container_name: anizoneflix-bot
    env_file:
      - .env
    environment:
      - WEB_ONLY=false
    ports:
      - "${PORT:-10000}:10000"
    restart: unless-stopped
    # Optional: healthcheck if /ping is available
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:10000/ping"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
